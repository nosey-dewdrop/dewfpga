name: webkit regression
on: workflow_dispatch

jobs:
  consecutive-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sim/package-lock.json }
      - name: install locked dependencies and Linux WebKit
        working-directory: sim
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps webkit
      - name: five consecutive full WebKit suites
        working-directory: sim
        shell: bash
        env:
          BROWSER: webkit
        run: |
          for attempt in 1 2 3 4 5; do
            export E2E_OUT="$RUNNER_TEMP/webkit-regression/run-$attempt"
            mkdir -p "$E2E_OUT"
            date -u +%FT%TZ > "$E2E_OUT/start.txt"
            npm test 2>&1 | tee "$E2E_OUT/suite.log"
            date -u +%FT%TZ > "$E2E_OUT/passed.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-regression
          path: ${{ runner.temp }}/webkit-regression

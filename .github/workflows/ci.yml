name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  macos-arm64:
    runs-on: macos-15          # Apple Silicon runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install shellcheck
      - name: install toolchain from scratch
        run: ./install.sh
      - name: test suite
        run: test/run.sh
      - name: npm package installs and runs
        run: |
          npm pack
          rm -f "$(brew --prefix)/bin/mac-fpga"      # install.sh linked it there; npm wants the same path
          npm install -g ./mac-fpga-*.tgz
          mkdir /tmp/w && cp templates/blink.sv templates/blink.xdc /tmp/w/
          cd /tmp/w && mac-fpga --version && mac-fpga bit && ls -l blink.bit
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: install-log, path: ~/fpga/install.log }
      - name: web installer against the freshly built package
        run: |
          mkdir -p /tmp/site && cp site/install /tmp/site/ && cp mac-fpga-*.tgz /tmp/site/mac-fpga.tgz
          MAC_FPGA_URL=file:///tmp/site MAC_FPGA_DIR=/tmp/cli bash site/install
          /tmp/cli/bin/mac-fpga check
      - name: site bundle (page, installer, package, templates, docs)
        run: |
          brew install pandoc
          mkdir -p out/docs out/templates/.vscode
          cp -R site/. out/ && cp mac-fpga-*.tgz out/mac-fpga.tgz
          cp templates/* out/templates/ && cp templates/.vscode/tasks.json out/templates/.vscode/
          pandoc -f gfm docs/manual-setup.md -s --css style.css --include-before-body docs/before.html --metadata title="How do you run CS223 labs on a Mac without Vivado?" -o out/docs/index.html
          cp docs/style.css out/docs/
          pandoc -f gfm docs/manual-setup.md -s --css docs/style.css --embed-resources --metadata title="How do you run CS223 labs on a Mac without Vivado?" -o /tmp/guide.html
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --no-pdf-header-footer --print-to-pdf=out/docs/cs223-mac-setup.pdf "file:///tmp/guide.html"
          ls -l out/docs/cs223-mac-setup.pdf
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }

  pages:
    needs: macos-arm64
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
